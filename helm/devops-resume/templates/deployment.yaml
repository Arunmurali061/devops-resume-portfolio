apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-resume-helm
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: devops-resume-helm
  template:
    metadata:
      labels:
        app: devops-resume-helm
    spec:
      containers:
        - name: devops-resume
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
