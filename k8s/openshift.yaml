apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-resume
  labels:
    app: devops-resume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-resume
  template:
    metadata:
      labels:
        app: devops-resume
    spec:
      containers:
        - name: web
          image: quay.io/arunmdevops/devops-resume:v1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: devops-resume
spec:
  selector:
    app: devops-resume
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: devops-resume
spec:
  to:
    kind: Service
    name: devops-resume
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
